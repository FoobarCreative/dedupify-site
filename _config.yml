# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Duplicate Photo Detection
    description                           : Automatically identify duplicate and similar photos taken in rapid succession. Easily review and delete unwanted duplicates to reclaim storage space.
    fontawesome_icon_name                 : images

  - title                                 : Calendar Event Cleanup
    description                           : Find and remove duplicate calendar events with ease. Clean up your calendars by identifying exact copies and redundant entries.
    fontawesome_icon_name                 : calendar-alt

  - title                                 : Preview Before Deletion
    description                           : Review all items before deletion with a clear preview interface. Make informed decisions about what to keep and what to remove.
    fontawesome_icon_name                 : eye

  - title                                 : Batch Operations
    description                           : Delete multiple duplicate photos or calendar events at once. Save time by processing groups of items together instead of one by one.
    fontawesome_icon_name                 : tasks

  - title                                 : Customizable Settings
    description                           : Adjust time intervals for duplicate photo detection to match your preferences. Fine-tune how the app identifies similar photos.
    fontawesome_icon_name                 : sliders-h

  - title                                 : Free Up Space
    description                           : Reclaim precious storage on your device and in the cloud. Remove duplicate photos and events to keep your iPhone running smoothly.
    fontawesome_icon_name                 : hdd

  - title                                 : # New Feature Title
    description                           : # New Feature Description
    fontawesome_icon_name                 : # Enter Font Awesome icon name (e.g. star). Find icons on fontawesome.com/icons.

