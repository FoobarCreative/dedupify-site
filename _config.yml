####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

# Site URL for absolute URLs
url: "https://www.dedupify.app"
baseurl: ""

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# Exclude these files from your production _site
exclude:
  - LICENSE
  - README.md
  - CNAME
  - _pages/changelog.md

include:
  - ".well-known"

collections:
  pages:
    output: true
    permalink: /:path
  guides:
    output: true
    permalink: /guides/:slug

defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
      author: "Dedupify Team"

# Markdown rendering
markdown: kramdown

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
